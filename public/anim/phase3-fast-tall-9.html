<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 3 — Why the 9 Had to Get Fast Too — Variation Theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'Space Grotesk',sans-serif}
.board{background:#0d1214;border-radius:16px;overflow:hidden;border:0.5px solid rgba(180,220,190,.14)}
.board-top{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.board-top h4{color:#f3f1ea;font-size:.82rem;margin:0;font-weight:600}
.board-top .bdesc{color:#8fbf93;font-size:.72rem;margin:0;margin-left:auto}
.board-body{padding:16px 18px}
.board-ctrl{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.board-ctrl button{font-family:'Space Grotesk',sans-serif;font-size:.76rem;font-weight:600;letter-spacing:.03em;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;transition:all .15s}
.btn-play{background:#2f6b34;color:#eafff0}
.btn-play:hover{background:#3c8143}
.btn-reset{background:rgba(255,255,255,.08);color:#c2ccc3;border:1px solid rgba(255,255,255,.14)}
.btn-reset:hover{background:rgba(255,255,255,.14)}
.step-info{font-size:.74rem;color:#8fbf93;line-height:1.4;font-style:italic}
canvas{display:block;width:100%;aspect-ratio:2.3/1;border-radius:10px}
</style>
</head>
<body>

<div class="board">
  <div class="board-top"><h4>Phase 3 — Why the 9 Had to Get Fast Too</h4><span class="bdesc">Low block needs a target man &rarr; transitions need pace &rarr; one player, both jobs</span></div>
  <div class="board-body"><canvas id="cvP3" height="240"></canvas></div>
  <div class="board-ctrl">
    <button class="btn-play" id="btnP3Play">&#9654; Next</button>
    <button class="btn-reset" id="btnP3Reset">&#8634; Restart</button>
    <div class="step-info" id="infoP3">The extreme answer to False 9: an ultra-low 5-4-1</div>
  </div>
</div>

<script>
try{
const ease={outC:t=>1-Math.pow(1-t,3)};
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}
function bezier(t,p0,cp,p1){const u=1-t;return{x:u*u*p0.x+2*u*t*cp.x+t*t*p1.x,y:u*u*p0.y+2*u*t*cp.y+t*t*p1.y}}
function autoCP(p0,p1,lift=0.25){const d=dist(p0,p1);return{x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2-d*lift}}

class Player{
  constructor(x,y,color,label,r=15){this.x=x;this.y=y;this.tx=x;this.ty=y;this.color=color;this.label=label;this.r=r;this.glowA=0;this.qA=0}
  moveTo(x,y){this.tx=x;this.ty=y}
  snap(x,y){this.x=x;this.y=y;this.tx=x;this.ty=y}
  update(dt){
    const spd=clamp(6*dt,0,.18);
    this.x=lerp(this.x,this.tx,spd); this.y=lerp(this.y,this.ty,spd);
    this.glowA=lerp(this.glowA,this.hasBall?0.8:0,clamp(5*dt,0,.3));
    this.qA=lerp(this.qA,this.showQ?1:0,clamp(4*dt,0,.25));
  }
  draw(ctx,now){
    const r=this.r;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); ctx.restore();
    if(this.glowA>0.02){
      ctx.save(); ctx.globalAlpha=this.glowA; ctx.shadowColor=this.color; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(this.x,this.y,r+5,0,Math.PI*2); ctx.strokeStyle=this.color; ctx.lineWidth=2.5; ctx.stroke(); ctx.restore();
    }
    const gr=ctx.createRadialGradient(this.x-r*.3,this.y-r*.3,0,this.x,this.y,r);
    gr.addColorStop(0,lighten(this.color,.3)); gr.addColorStop(1,this.color);
    ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fillStyle=gr; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.font=`700 ${Math.max(7,r*.6)}px DM Mono`; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.label,this.x,this.y+.5); ctx.textBaseline='alphabetic';
    if(this.qA>0.02){
      ctx.save(); ctx.globalAlpha=this.qA; const bounce=Math.sin(now/180)*4;
      ctx.font='bold 15px sans-serif'; ctx.fillStyle='#ff4444'; ctx.textAlign='center';
      ctx.shadowColor='rgba(255,0,0,.6)'; ctx.shadowBlur=8; ctx.fillText('?',this.x,this.y-r-13+bounce); ctx.restore();
    }
  }
}
function lighten(hex,amt){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+Math.round(255*amt))},${Math.min(255,g+Math.round(255*amt))},${Math.min(255,b+Math.round(255*amt))})`;
}
class Ball{
  constructor(x,y){this.x=x;this.y=y;this.trail=[];this.anim=null;this.spin=0}
  playTo(p0,p1,dur=0.55,lift=0.22){const cp=autoCP(p0,p1,lift);this.anim={p0:{...p0},cp,p1:{...p1},dur,t:0,done:false}}
  update(dt){
    if(!this.anim||this.anim.done){this.trail.push({x:this.x,y:this.y,age:0})}
    if(this.anim&&!this.anim.done){
      this.anim.t=Math.min(this.anim.t+dt/this.anim.dur,1);
      const te=ease.outC(this.anim.t);
      const pos=bezier(te,this.anim.p0,this.anim.cp,this.anim.p1);
      this.trail.push({x:this.x,y:this.y,age:0});
      this.x=pos.x; this.y=pos.y; this.spin+=dt*12;
      if(this.anim.t>=1){this.anim.done=true}
    }
    for(const t of this.trail) t.age+=dt;
    this.trail=this.trail.filter(t=>t.age<0.22);
  }
  draw(ctx){
    for(const t of this.trail){
      const a=clamp(1-t.age/0.22,0,1);
      ctx.beginPath(); ctx.arc(t.x,t.y,4*a,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,200,${a*0.3})`; ctx.fill();
    }
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=6; ctx.shadowOffsetY=3;
    ctx.beginPath(); ctx.arc(this.x,this.y,7,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(this.x,this.y,7,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.stroke();
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.spin);
    ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(5,0); ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  }
  snap(x,y){this.x=x;this.y=y;this.anim=null;this.trail=[]}
}
function drawPitch(ctx,W,H){
  const stripes=8;
  for(let i=0;i<stripes;i++){ ctx.fillStyle=i%2===0?'#275221':'#2d5a27'; ctx.fillRect(0,i*(H/stripes),W,H/stripes+1); }
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.4;
  ctx.strokeRect(10,10,W-20,H-20);
  ctx.beginPath(); ctx.moveTo(W/2,10); ctx.lineTo(W/2,H-10); ctx.stroke();
  const cr=Math.min(W,H)*.12;
  ctx.beginPath(); ctx.arc(W/2,H/2,cr,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  const paW=W*.17,paH=H*.44;
  ctx.strokeRect(10,(H-paH)/2,paW,paH); ctx.strokeRect(W-10-paW,(H-paH)/2,paW,paH);
  const sbW=paW*.42,sbH=H*.2;
  ctx.strokeRect(10,(H-sbH)/2,sbW,sbH); ctx.strokeRect(W-10-sbW,(H-sbH)/2,sbW,sbH);
  ctx.beginPath(); ctx.arc(10+paW*.72,H/2,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-10-paW*.72,H/2,3,0,Math.PI*2); ctx.fill();
  const gH=H*.17;
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.fillRect(0,(H-gH)/2,10,gH); ctx.fillRect(W-10,(H-gH)/2,10,gH);
  ctx.strokeRect(0,(H-gH)/2,10,gH); ctx.strokeRect(W-10,(H-gH)/2,10,gH);
}
function drawArrow(ctx,x1,y1,x2,y2,color,w=2,dashed=false,headSize=9){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=w;
  if(dashed) ctx.setLineDash([7,5]); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]);
  const angle=Math.atan2(y2-y1,x2-x1);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-headSize*Math.cos(angle-.42),y2-headSize*Math.sin(angle-.42));
  ctx.lineTo(x2-headSize*Math.cos(angle+.42),y2-headSize*Math.sin(angle+.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function zoneRect(ctx,x,y,w,h,color,alpha,pulse){
  ctx.save(); ctx.globalAlpha=alpha*(pulse||1); ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,6); ctx.fill();
  ctx.globalAlpha=Math.min(1,(alpha+.15)*(pulse||1)); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
}
function bubbleLabel(ctx,text,x,y,bg,fg,size=11){
  ctx.save(); ctx.font=`600 ${size}px Noto Sans KR`;
  const tw=ctx.measureText(text).width+16;
  ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(x-tw/2,y-14,tw,22,5); ctx.fill();
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,x,y-3); ctx.restore();
}
function drawOffsideLine(ctx,x,H,label){
  ctx.save(); ctx.globalAlpha=0.55; ctx.setLineDash([3,4]);
  ctx.strokeStyle='#9AD1FF'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,14); ctx.lineTo(x,H-14); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  if(label){
    ctx.save(); ctx.globalAlpha=0.75; ctx.font='700 8px DM Mono'; ctx.textAlign='center'; ctx.fillStyle='#9AD1FF';
    ctx.fillText('OFFSIDE LINE',x,H-4); ctx.restore();
  }
}

// ── cvP3 — Low block needs a target man, transitions need pace ──
const cv=document.getElementById('cvP3');
const ctx=cv.getContext('2d');
let W=0,H=0,step=0;
const GOLD='#C9A84C',LGOLD='#F0C858',RED='#E05C5C',GREEN='#5EC97A',TEAL='#4ECDC4';

// Attack — 3-2-4-1 (11)
const aGK  =new Player(0,0,GOLD,'GK',9);
const aLCB =new Player(0,0,GOLD,'CB',9);
const aCB  =new Player(0,0,GOLD,'CB',9);
const aRCB =new Player(0,0,GOLD,'CB',9);
const aLDM =new Player(0,0,GOLD,'DM',9);
const aRDM =new Player(0,0,GOLD,'DM',9);
const aLW  =new Player(0,0,LGOLD,'LW',9);
const aLCAM=new Player(0,0,LGOLD,'AM',9);
const aRCAM=new Player(0,0,LGOLD,'AM',9);
const aRW  =new Player(0,0,LGOLD,'RW',9);
const aTM  =new Player(0,0,GREEN,'9',12);

// Defence — 5-4-1 (11)
const dGK  =new Player(0,0,RED,'GK',9);
const dRWB =new Player(0,0,RED,'WB',8);
const dCB1 =new Player(0,0,RED,'CB',9);
const dCB2 =new Player(0,0,RED,'CB',9);
const dCB3 =new Player(0,0,RED,'CB',9);
const dLWB =new Player(0,0,RED,'WB',8);
const dRM  =new Player(0,0,RED,'RM',8);
const dRCM =new Player(0,0,RED,'CM',9);
const dLCM =new Player(0,0,RED,'CM',9);
const dLM  =new Player(0,0,RED,'LM',8);
const dST  =new Player(0,0,RED,'9',9);

const ball=new Ball(0,0);
const atkP=[aGK,aLCB,aCB,aRCB,aLDM,aRDM,aLW,aLCAM,aRCAM,aRW,aTM];
const defP=[dGK,dRWB,dCB1,dCB2,dCB3,dLWB,dRM,dRCM,dLCM,dLM,dST];
const allP=[...atkP,...defP];

let pocketSpot={x:0,y:0}, ftPos={x:0,y:0};

const MSGS=[
  'The extreme answer to False 9: an ultra-low 5-4-1 (11 v 11)',
  '① No gap between keeper and back line — the pocket pass is smothered',
  '② The route through is crosses and long balls — win the box, win the second ball',
  '③ But title races are mostly proactive vs proactive — those games turn on transitions',
  "④ A slow target man can't punish the turnover — you need pace in behind too",
  '⑤ One player, both jobs — Fast + Tall 9: box threat and sprint threat, same man'
];

function snapLowBlock(){
  aGK.snap(W*.04,H*.50);
  aLCB.snap(W*.14,H*.30); aCB.snap(W*.12,H*.50); aRCB.snap(W*.14,H*.70);
  aLDM.snap(W*.28,H*.42); aRDM.snap(W*.28,H*.58);
  aLW.snap(W*.64,H*.18); aLCAM.snap(W*.58,H*.38); aRCAM.snap(W*.58,H*.62); aRW.snap(W*.64,H*.82);
  aTM.snap(W*.86,H*.50);
  dGK.snap(W*.97,H*.50);
  dRWB.snap(W*.84,H*.16); dCB1.snap(W*.87,H*.32); dCB2.snap(W*.88,H*.50); dCB3.snap(W*.87,H*.68); dLWB.snap(W*.84,H*.84);
  dRM.snap(W*.74,H*.20); dRCM.snap(W*.76,H*.42); dLCM.snap(W*.76,H*.58); dLM.snap(W*.74,H*.80);
  dST.snap(W*.58,H*.50);
}

function initP3(){
  W=cv.offsetWidth; H=cv.offsetHeight;
  if(!W||!H)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
  step=0;
  aTM.label='9';
  pocketSpot={x:W*.68,y:H*.50};
  ftPos={x:W*.66,y:H*.48};
  snapLowBlock();
  ball.snap(aLCAM.x,aLCAM.y);
  allP.forEach(p=>{p.showQ=false;p.hasBall=false});
  aLCAM.hasBall=true;
  document.getElementById('infoP3').textContent=MSGS[0];
}

function nextP3(){
  if(!W)initP3();
  if(!W||step>=5)return;
  step++;
  allP.forEach(p=>p.showQ=false);
  document.getElementById('infoP3').textContent=MSGS[step];
  if(step===1){
    aLCAM.hasBall=false;
    ball.playTo({x:aLCAM.x,y:aLCAM.y},{x:pocketSpot.x,y:pocketSpot.y},0.5,0.06);
    dRCM.moveTo(pocketSpot.x+W*.02,pocketSpot.y-H*.06);
    dCB2.moveTo(pocketSpot.x+W*.03,pocketSpot.y+H*.03);
  }
  if(step===2){
    ball.snap(aLW.x,aLW.y); aLW.hasBall=true;
    ball.playTo({x:aLW.x,y:aLW.y},{x:aTM.x,y:aTM.y},0.5,0.14);
    aLW.hasBall=false; aTM.hasBall=true;
    dRCM.moveTo(W*.76,H*.42); dCB2.moveTo(W*.88,H*.50);
  }
  if(step===3){
    // scene cut — turnover just past the centre circle, both teams committed forward
    aGK.snap(W*.10,H*.50);
    aLCB.snap(W*.32,H*.30); aCB.snap(W*.30,H*.50); aRCB.snap(W*.32,H*.70);
    aLDM.snap(W*.44,H*.42); aRDM.snap(W*.44,H*.58);
    aLW.snap(W*.62,H*.16); aLCAM.snap(W*.56,H*.38); aRCAM.snap(W*.56,H*.62); aRW.snap(W*.62,H*.84);
    aTM.snap(W*.74,H*.46);
    dGK.snap(W*.90,H*.50);
    dRWB.snap(W*.58,H*.16); dCB1.snap(W*.62,H*.34); dCB2.snap(W*.85,H*.52); dCB3.snap(W*.60,H*.68); dLWB.snap(W*.58,H*.84);
    dRM.snap(W*.40,H*.18); dRCM.snap(W*.38,H*.42); dLCM.snap(W*.38,H*.58); dLM.snap(W*.40,H*.80);
    dST.snap(W*.44,H*.50);
    ball.snap(dRCM.x,dRCM.y);
    allP.forEach(p=>{p.hasBall=false});
    dRCM.hasBall=true;
  }
  if(step===4){
    aTM.moveTo(W*.80,H*.42);
    dRCM.hasBall=false;
    dCB2.moveTo(W*.60,H*.50);
    aTM.showQ=true;
  }
  if(step===5){
    aTM.label='FT9';
    aTM.moveTo(ftPos.x,ftPos.y);
    dCB2.moveTo(W*.58,H*.56);
  }
}

function updateP3(dt){ if(!W)return; allP.forEach(p=>p.update(dt)); ball.update(dt); }

function drawP3(now){
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  drawPitch(ctx,W,H);

  if(step<=2){
    ctx.save(); ctx.font='700 9px DM Mono'; ctx.textAlign='center'; ctx.fillStyle='rgba(224,92,92,.75)';
    ctx.fillText('RED 5-4-1 LOW BLOCK',W*.80,H*.06); ctx.restore();
    ctx.save(); ctx.font='700 9px DM Mono'; ctx.textAlign='center'; ctx.fillStyle='rgba(240,200,80,.65)';
    ctx.fillText('YELLOW 3-2-4-1',W*.22,H*.06); ctx.restore();
    const boxA=0.08+0.04*Math.sin(now/450);
    zoneRect(ctx,W*.74,H*.10,W*.24,H*.80,RED,boxA,1);
    const offsideX=Math.max(dRWB.x,dCB1.x,dCB2.x,dCB3.x,dLWB.x);
    drawOffsideLine(ctx,offsideX,H,step===0);
  }
  if(step===1){
    bubbleLabel(ctx,'Pocket smothered',pocketSpot.x,pocketSpot.y-24,'rgba(224,92,92,.42)',RED,10);
    ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle=RED; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pocketSpot.x-8,pocketSpot.y-8); ctx.lineTo(pocketSpot.x+16,pocketSpot.y+16);
    ctx.moveTo(pocketSpot.x+16,pocketSpot.y-8); ctx.lineTo(pocketSpot.x-8,pocketSpot.y+16); ctx.stroke(); ctx.restore();
  }
  if(step===2){
    const a=0.5+0.35*Math.sin(now/240);
    ctx.save(); ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(aTM.x,aTM.y,aTM.r+9,0,Math.PI*2);
    ctx.strokeStyle=GREEN; ctx.lineWidth=2.2; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    bubbleLabel(ctx,'Flick-on, second ball',aTM.x,aTM.y-28,'rgba(94,201,122,.44)',GREEN,10);
  }
  if(step===3){
    ctx.save(); ctx.font='700 9px DM Mono'; ctx.textAlign='center'; ctx.fillStyle='rgba(240,200,80,.75)';
    ctx.fillText('TURNOVER — BOTH TEAMS COMMITTED FORWARD',W*.50,H*.07); ctx.restore();
    bubbleLabel(ctx,'Ball changes hands',dRCM.x,dRCM.y-22,'rgba(240,200,80,.42)',LGOLD,10);
  }
  if(step===4){
    bubbleLabel(ctx,'Recovery defender catches him',dCB2.x,dCB2.y-22,'rgba(224,92,92,.40)',RED,9);
    bubbleLabel(ctx,'Too slow — break fizzles',aTM.x,aTM.y-26,'rgba(224,92,92,.44)',RED,10);
  }
  if(step===5){
    const a=0.55+0.30*Math.sin(now/230);
    ctx.save(); ctx.globalAlpha=a;
    drawArrow(ctx,aTM.x,aTM.y,W*.86,H*.46,GREEN,2.2,true,9);
    drawArrow(ctx,aTM.x,aTM.y,W*.86,H*.62,TEAL,2.2,true,9);
    ctx.restore();
    bubbleLabel(ctx,'Aerial threat — the box',W*.87,H*.38,'rgba(94,201,122,.44)',GREEN,9.5);
    bubbleLabel(ctx,'Sprint threat — in behind',W*.87,H*.70,'rgba(78,205,196,.44)',TEAL,9.5);
    bubbleLabel(ctx,'One player, both jobs',aTM.x,aTM.y-30,'rgba(240,200,80,.46)',LGOLD,11);
  }

  defP.forEach(p=>p.draw(ctx,now));
  atkP.forEach(p=>p.draw(ctx,now));
  ball.draw(ctx);

  bubbleLabel(ctx,MSGS[step],W/2,H-14,'rgba(0,0,0,.50)','rgba(255,255,255,.78)',10);
}

document.getElementById('btnP3Play').addEventListener('click',nextP3);
document.getElementById('btnP3Reset').addEventListener('click',initP3);

let lastTs=null;
function loop(ts){
  if(lastTs===null) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,.05); lastTs=ts;
  updateP3(dt); drawP3(ts);
  requestAnimationFrame(loop);
}
window.addEventListener('load',()=>{
  function tryStart(){
    initP3();
    if(!W){ requestAnimationFrame(tryStart); return; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(tryStart);
});
window.addEventListener('resize',()=>{ initP3(); });
}catch(e){ console.warn('P3 anim error',e); }
</script>
</body>
</html>
